# substrate_freeze_manifest.toml — HW-SW-003 C1
#
# Pins sha256 digests of the constitution and the substrate-critical source
# files this repo's audits bind to. scripts/audit-substrate-freeze.sh
# recomputes every digest below with sha256sum and fails closed on any
# mismatch; it also independently checks the constitution digest against the
# pinned value in evidence/loops/hw_sw_001_20260703/PREDICATE.md, so tampering
# only this file cannot silently move the constitution pin.
#
# REPIN: ceremony — any legitimate change to a pinned digest below MUST:
#   1. Recompute the new digest: `sha256sum <path>`.
#   2. Update the matching entry below in the SAME commit as the source
#      change (or, for the constitution, in the same commit as the
#      human-sudo-authored constitutional amendment).
#   3. Use a commit message containing the literal token `REPIN:` followed
#      by the rationale, e.g.:
#        REPIN: turing-approval lib.rs — added HardwareFuture byte surface
#   A digest changing here without a `REPIN:` commit is a freeze violation,
#   not a routine update.
#
# This manifest is a tooling artifact (allowed_files), not the constitution
# itself; only the constitution file this manifest points at is forbidden to
# write.

