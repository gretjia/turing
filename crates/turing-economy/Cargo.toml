[package]
name = "turing-economy"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[dependencies]
turing-contracts = { path = "../turing-contracts" }
serde = { version = "=1.0.228", features = ["derive"] }
# serde_json: build the scaffold_descriptor.v1 JSON value for jcs::canonicalize (WP3,
# ADR-ECON-003 Decision 1). Pinned to the same version already used workspace-wide.
serde_json = { version = "=1.0.150", features = ["preserve_order"] }
# unicode-normalization: NFC normalization for domain_bucket (WP3, ADR-ECON-003 Decision 1).
unicode-normalization = "=0.1.25"

[lints]
workspace = true
